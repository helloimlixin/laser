defaults:
  - laser
  - _self_

# Shared 256px image autoencoder: 8x8 sites, four OMP atoms per site.
backbone: rqvae
num_hiddens: 128
num_residual_blocks: 2
num_residual_hiddens: 128
num_downsamples: 5
channel_multipliers: [1, 1, 2, 2, 4, 4]
backbone_latent_channels: 256
attn_resolutions: [16]
use_mid_attention: true
dropout: 0.0
embedding_dim: 256
num_embeddings: 16384
sparsity_level: 4
patch_based: false
patch_size: 1
patch_stride: 1
patch_reconstruction: tile
commitment_cost: 0.25
bottleneck_loss_weight: 0.25
dict_learning_rate: 4.0e-5
coef_max: null
data_init_from_first_batch: true
recon_mse_weight: 1.0
recon_l1_weight: 0.0
recon_edge_weight: 0.0
perceptual_weight: 1.0
perceptual_start_step: 0
perceptual_warmup_steps: 0
adversarial_weight: 0.75
adversarial_start_step: 5000
adversarial_warmup_steps: 0
disc_start_step: 5000
disc_num_layers: 2
disc_learning_rate: 4.0e-5
discriminator_beta1: 0.5
discriminator_beta2: 0.9
compute_fid: true
log_images_every_n_steps: 250
enable_val_latent_visuals: false
